name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            rust \
            alsa-lib \
            ca-certificates \
            git

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --check

      - name: Test
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -euo pipefail
          BIN="target/release/opencode-voice"
          strip "$BIN"
          mkdir -p dist
          cp "$BIN" dist/
          cp README.md LICENSE dist/
          tar -C dist -czf "opencode-voice-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-voice-${{ github.sha }}
          path: opencode-voice-*-x86_64-linux.tar.gz
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: opencode-voice-${{ github.ref_name }}-x86_64-linux.tar.gz
          generate_release_notes: true
